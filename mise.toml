[tools]
python = "3.12"
node = "24"
uv = "0.11"
"pipx:graphifyy" = "latest"

[env]
_.python.venv = { path = ".venv", create = true }

[tasks.setup]
description = "Install Python deps into .venv, the review app's npm deps, and point the graphify hook at mise's graphify"
run = [
  "uv pip install -r tools/requirements.txt",
  "npm --prefix tools/review/frontend ci",
  "mkdir -p graphify-out && head -1 \"$(mise which graphify)\" | sed 's/^#![[:space:]]*//' > graphify-out/.graphify_python",
]

[tasks.test]
description = "Run the tools test suite"
run = "python -m pytest tools/tests"

[tasks.validate]
description = "Check every source citation in the docs"
run = "python tools/validate_citations.py"

[tasks.lint]
description = "Lint reference/logic/"
run = "python tools/lint_logic.py"

[tasks."review:build"]
description = "Build the review app frontend"
dir = "tools/review/frontend"
run = "npm run build"

[tasks.review]
description = "Serve the review app on http://127.0.0.1:8765"
# --lifespan off: the app has no startup/shutdown hooks, and mise forwards Ctrl-C on top of the
# terminal's own SIGINT, which force-exits uvicorn mid-shutdown and logs a CancelledError traceback.
run = "python -m uvicorn app:app --app-dir tools/review/backend --host 127.0.0.1 --port 8765 --lifespan off"

[tasks."review:test"]
description = "Agent-only test instance of the review app on http://127.0.0.1:8766 (auto-reloads backend code; the human's `mise run review` on :8765 is never touched)"
run = "python -m uvicorn app:app --app-dir tools/review/backend --host 127.0.0.1 --port 8766 --lifespan off --reload"

[tasks."review:dev"]
description = "Vite dev server for the review app (run `mise run review` too)"
dir = "tools/review/frontend"
run = "npm run dev"
